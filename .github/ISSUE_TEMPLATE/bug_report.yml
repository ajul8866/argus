name: Bug report
description: Report a reproducible problem in Argus.
title: 'bug: '
body:
  - type: markdown
    attributes:
      value: 'For security vulnerabilities, use [private reporting](https://github.com/ajul8866/argus/security/advisories/new). Remove credentials and private source from all attachments.'
  - type: textarea
    id: versions
    attributes:
      label: Environment
      description: Argus version, Bun version, operating system, and harness versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide a minimal example using a repository you can share.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or screenshots
